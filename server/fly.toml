# Конфиг Fly.io. Деплой: flyctl launch --copy-config --no-deploy && flyctl deploy
# Имя приложения поменяйте на своё (должно быть уникальным на fly.io).
app = "site-to-figma"
primary_region = "waw"

[build]
  dockerfile = "Dockerfile"

[env]
  CLOUD = "1"
  RATE_LIMIT = "20"
  MAX_CONCURRENT = "2"

[http_service]
  internal_port = 4511
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
