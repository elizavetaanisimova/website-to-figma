  /* Формы, радиусы и тени — из UI-кита «Friendzy» (Untitled.fig), а палитра
     наша: оранжевый и белый. Сливово-розовые токены кита выкинуты — вместо них
     тёплые оранжевые оттенки. Один акцент — коралл #CE4A17 (белое на нём 4.55:1,
     весь текст на акценте белый). #FF6A3D — тот же коралл посветлее, только под
     графику без текста. Дальше по светлоте: персик #FFAA85, светлый #FFB596,
     жёлоб полей #FDEBE1, канва #FFF9F5, белые карточки. */
  :root {
    --canvas: #FFF9F5;
    --surface: #FFFFFF;
    /* жёлоб сегментов и утопленные поля — светлый оранжевый тинт */
    --fill: #FDEBE1;
    --hair: #F4DDD0;
    --ink: #2A1A11;
    /* #8A6B58 на белом даёт 4.7:1; вторичным текстом пользуемся только в карточках */
    --ink2: #8A6B58;
    /* глубокий оранжевый — текст и иконки на светлых тинтах (был --plum) */
    --plum: #B24413;
    --coral: #CE4A17;
    --coral-lift: #FF6A3D;
    --peach: #FFAA85;
    --pink: #FFB596;
    --accent-ink: #B24413;
    --on-accent: #FFFFFF;
    /* иконка на персиковом/светло-оранжевом кружке — тёмно-оранжевая */
    --on-tint: #8A3410;
    --green: #1B6C4B;
    --green-soft: #E4F1EA;
    --red: #BE3128;
    --red-soft: #F9E7E1;
    --ring: rgba(206, 74, 23, .28);
    /* кремовый живёт только на коралловой плашке — она одинакова в обеих темах */
    --cream: #FFF3EC;
    --cream-ink: #5F574F;

    /* радиусы кита: 8 тег / 16 поле / 24 карточка / пилюля */
    --r-sm: 8px;
    --r-md: 16px;
    --r-lg: 24px;

    /* Тени кита — не на всём, а точечно: карточка, плавающий элемент, активная
       пилюля сегмента. Оттенок тёплый оранжевый, не серый. */
    --sh-1: 0 1px 2px rgba(140, 48, 12, .05), 0 8px 24px -10px rgba(140, 48, 12, .16);
    --sh-2: 0 8px 40px rgba(180, 68, 19, .18);
    --sh-accent: 0 2px 5px rgba(140, 48, 12, .20), 0 12px 22px -8px rgba(140, 48, 12, .34);
    /* пилюля активного сегмента — двойная тень кита один в один */
    --sh-knob: 0 3px 1px rgba(140, 48, 12, .05), 0 3px 8px rgba(140, 48, 12, .14);
  }
  html.figma-dark {
    --canvas: #17100B;
    --surface: #271A12;
    --fill: #382418;
    --hair: #4E3826;
    --ink: #FBEFE7;
    --ink2: #C0A594;
    --plum: #FF9B6B;
    --coral: #CE4A17;
    --coral-lift: #FF7A4D;
    --on-tint: #2A1508;
    --accent-ink: #FF9B72;
    --green: #5FCB98;
    --green-soft: #17332A;
    --red: #F0837C;
    --red-soft: #3A2019;
    --ring: rgba(255, 107, 66, .35);
    --sh-1: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px -10px rgba(0, 0, 0, .7);
    --sh-2: 0 8px 40px rgba(0, 0, 0, .6);
    --sh-accent: 0 2px 6px rgba(0, 0, 0, .5), 0 14px 24px -8px rgba(140, 48, 12, .5);
    --sh-knob: 0 3px 1px rgba(0, 0, 0, .3), 0 3px 8px rgba(0, 0, 0, .5);
  }
  @media (prefers-color-scheme: dark) {
    html:not(.figma-light):not(.figma-dark) {
      --canvas: #17100B; --surface: #271A12; --fill: #382418; --hair: #4E3826;
      --ink: #FBEFE7; --ink2: #C0A594; --plum: #FF9B6B; --on-tint: #2A1508;
      --coral-lift: #FF7A4D; --accent-ink: #FF9B72;
      --green: #5FCB98; --green-soft: #17332A; --red: #F0837C; --red-soft: #3A2019;
      --ring: rgba(255, 107, 66, .35);
      --sh-1: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px -10px rgba(0, 0, 0, .7);
      --sh-2: 0 8px 40px rgba(0, 0, 0, .6);
      --sh-accent: 0 2px 6px rgba(0, 0, 0, .5), 0 14px 24px -8px rgba(140, 48, 12, .5);
      --sh-knob: 0 3px 1px rgba(0, 0, 0, .3), 0 3px 8px rgba(0, 0, 0, .5);
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font: 11.5px/1.5 Manrope, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--canvas);
    color: var(--ink);
    padding: 18px 18px 16px;
    user-select: none;
    overflow-x: hidden;
  }

  /* ---------- шапка ----------
     Плашка всегда коралловая — и в светлой теме, и в тёмной, поэтому
     кремовый и его текст заданы фиксированно, а не через тему. */
  .hero {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--coral); color: var(--on-accent);
    border-radius: var(--r-lg); padding: 16px; overflow: hidden;
    box-shadow: var(--sh-accent);
  }
  .hero-txt { flex: 1; min-width: 0; }
  .hero h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.3px; }
  /* подзаголовок гасим весом, а не прозрачностью: полупрозрачный белый
     на коралле проваливается ниже 4.5:1 */
  .tagline { font-size: 10.5px; margin-top: 2px; font-weight: 450; color: #FFFFFF; }
  .hero-art { flex: none; margin: -2px 0 -8px; }
  /* выбор языка живёт в шапке отдельной строкой; в узкой панели переносится */
  .hero-row {
    margin-top: 11px;
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  }

  /* ---------- выбор языка ----------
     Живёт на коралловой плашке, поэтому цвета зашиты, а не взяты из темы.
     Неактивные — белым по кораллу (4.55:1), заливать их полупрозрачным белым
     нельзя: фон светлеет и контраст проваливается. */
  .lang-seg { display: inline-flex; gap: 4px; margin-left: auto; }
  .lang-seg button {
    padding: 5px 9px; border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .55);
    background: transparent; color: #FFFFFF;
    font: inherit; font-size: 10px; font-weight: 650; letter-spacing: .4px;
    cursor: pointer; transition: all .13s;
  }
  .lang-seg button:hover { border-color: #FFFFFF; }
  .lang-seg button.on {
    background: var(--cream); border-color: var(--cream);
    color: var(--cream-ink); box-shadow: var(--sh-knob);
  }

  /* ---------- бейджи секций ---------- */
  .sec-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }

  /* Кружок-подложка под иконку секции — как розовый кружок под иконками

  .badge {

    display: flex; align-items: center; justify-content: center;
    color: var(--on-tint);

  .badge.lav { background: var(--pink); }
  .badge.yellow { background: var(--peach); }
  /* на коралле иконка белая — на светлых заливках тёмная, иначе не видно */
  .badge.coral { background: var(--coral); color: var(--on-accent); }

  /* ---------- секции ----------
     Карточки кита — плоские белые прямоугольники r24 на розовой канве.
     Тень еле заметная: объём в ките держат не карточки, а плавающие кнопки. */
  .card {
    background: var(--surface); border: 0;
    border-radius: var(--r-lg); padding: 16px; margin-top: 12px;
    box-shadow: var(--sh-1);
  }
  .card > .field-label:first-child { margin-top: 1px; }
  .field-label {
    display: block;

  }

  /* ---------- URL ----------
     Поля кита — плоская розовая заливка r16, без утопленной тени.
     Фокус рисуется только кольцом. */
  .url-wrap { position: relative; }
  .url-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--plum); opacity: .55; }
  input[type=text], input[type=url], input[type=number], input[type=password], select {
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--r-md);
    border: 0;
    background: var(--fill);
    color: inherit; font: inherit; outline: none;
    transition: box-shadow .15s, background .15s;
  }
  .url-wrap input { padding-left: 38px; }
  input:focus, select:focus { box-shadow: 0 0 0 3px var(--ring); }

  /* Поле токена: замок слева, глаз справа — как поле URL, форма кита */
  .token-wrap { position: relative; }
  .token-wrap > svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--plum); opacity: .55; pointer-events: none;
  }
  .token-wrap input { padding-left: 38px; padding-right: 44px; }
  .token-wrap input[type=password] { letter-spacing: .16em; }
  .token-eye {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; padding: 0; margin: 0; border: 0;
    border-radius: 12px; background: transparent; color: var(--ink2);

  }
  .token-eye:hover { background: var(--fill); color: var(--plum); }

  .token-eye svg { width: 15px; height: 15px; display: block; }
  .token-hint {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 10px; font-size: 11px; font-weight: 650;
    color: var(--coral); text-decoration: none; cursor: pointer;
    border-radius: 8px; transition: opacity .15s;
  }
  .token-hint:hover { text-decoration: underline; }
  .token-hint:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }
  .token-hint svg { width: 13px; height: 13px; flex: none; }

  /* карточка URL сама работает полем: кольцо фокуса рисуется на ней */
  #url-card { padding: 5px; }

  #url-card input { background: transparent; box-shadow: none; padding: 11px 12px 11px 36px; }
  #url-card input:focus { box-shadow: none; }
  #url-card .url-wrap svg { left: 13px; }

  /* ---------- поиск страниц ---------- */
  .url-row { display: flex; gap: 6px; align-items: stretch; }
  .url-row .url-wrap { flex: 1; min-width: 0; }
  /* «Страницы» — вторичная кнопка кита: розовая заливка, сливовый текст */
  .find-btn {
    flex: none; padding: 0 16px; border-radius: var(--r-md);
    border: 0; background: var(--fill); color: var(--plum);
    font: inherit; font-size: 11px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
    transition: all .13s;
  }
  .find-btn:hover:not(:disabled) { filter: brightness(.97); }
  .find-btn:active:not(:disabled) { transform: translateY(1px); }
  .find-btn:disabled { opacity: .45; cursor: default; }
  .find-btn svg { flex: none; }

  #pages { display: none; }
  .pages-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .pages-head .field-label { margin: 0; flex: 1; }
  .link-btn {
    border: 0; background: transparent; color: var(--accent-ink);
    font: inherit; font-size: 10.5px; font-weight: 600; cursor: pointer;
    /* 6px по вертикали, чтобы кнопка была не тоньше 24px — в 2px по неё не попасть */
    padding: 6px 8px; margin: -6px 0; border-radius: 8px;
  }
  .link-btn:hover { background: var(--fill); }
  .pages-filter { margin-bottom: 8px; }
  .pages-filter input { padding: 9px 13px; border-radius: 12px; font-size: 11px; }
  .pages-list {
    max-height: 220px; overflow-y: auto; overscroll-behavior: contain;
    /* строки подсвечиваются с заходом в поля карточки; список расширен под них,
       иначе overflow-y: auto добавляет ещё и горизонтальную полосу прокрутки */
    margin: 0 -8px; overflow-x: hidden;
  }
  .page-row {
    /* настоящая кнопка, а не div: иначе строка недостижима с клавиатуры */
    display: flex; align-items: center; gap: 9px; text-align: left;
    width: 100%; padding: 8px; margin: 0;
    border: 0; border-bottom: 1px solid var(--hair);
    background: transparent; color: inherit; font: inherit;
    cursor: pointer;
  }
  .page-row:last-child { border-bottom: 0; }
  .page-row:hover { background: var(--fill); }
  .page-row .box {
    flex: none; width: 18px; height: 18px; border-radius: 6px;
    border: 1.5px solid var(--hair); background: transparent;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s;
  }
  .page-row .box svg { opacity: 0; color: var(--on-accent); }
  .page-row.on .box { background: var(--coral); border-color: var(--coral); }
  .page-row.on .box svg { opacity: 1; }
  .page-row .txt { display: block; flex: 1; min-width: 0; }
  .page-row .n {
    display: block; font-size: 11px; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .page-row .p {
    display: block; font-size: 9.5px; color: var(--ink2); margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pages-foot {
    display: flex; align-items: center; gap: 8px;
    margin-top: 8px; font-size: 10px; color: var(--ink2);
  }
  .pages-foot .spacer { flex: 1; }
  .pages-warn { color: var(--red); }
  .pages-empty { padding: 18px 14px 14px; text-align: center; color: var(--ink2); font-size: 10.5px; }
  .pages-empty svg { display: block; margin: 0 auto 8px; }

  /* ---------- чипы устройств ----------
     Чип-интерес кита: пилюля r32, обводка на невыбранном, заливка на выбранном.
     У нас выбранный — коралловый (бренд), невыбранный — сливовая обводка. */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 999px;
    border: 1.5px solid var(--hair); background: transparent; color: var(--plum);
    cursor: pointer; font: inherit; font-size: 11px; font-weight: 600;
    transition: all .13s;
  }
  .chip svg { flex: none; }
  .chip:hover { border-color: var(--plum); }
  .chip.on {
    background: var(--coral); border-color: var(--coral);
    color: var(--on-accent); font-weight: 700;
  }
  .chip input {
    width: 46px; background: transparent; border: 0; padding: 0;
    color: inherit; font-size: 11px; box-shadow: none; border-radius: 0;
  }
  .chip input:focus { box-shadow: none; background: transparent; }
  .chip input::placeholder { color: inherit; opacity: .5; }
  /* ширина вне 320–3000 молча выпадала из импорта — теперь это видно */
  .chip.bad { border-color: var(--red); color: var(--red); }
  .chip.bad.on { background: var(--red); border-color: var(--red); color: #FFFFFF; }
  #custom-hint { display: none; margin-top: 8px; font-size: 10px; color: var(--red); }
  #custom-hint.show { display: block; }

  /* ---------- сегменты темы ----------
     Форма табов кита: утопленный жёлоб (--fill), активная белая пилюля
     с двойной тенью (--sh-knob). Цвет наш — оранжевый текст. */
  .seg {
    display: flex; background: var(--fill); border-radius: var(--r-md);
    padding: 4px; gap: 2px;
  }
  /* сегменты равной ширины — тянутся на всю карточку, чтобы вес не съезжал */
  .seg button {
    flex: 1 1 0; padding: 8px 0; border: 0; text-align: center;
    background: transparent; color: var(--plum);
    font: inherit; font-size: 11px; font-weight: 600;
    border-radius: 12px; cursor: pointer; transition: all .13s;
  }
  .seg button:hover:not(.on) { opacity: .7; }
  .seg button.on {
    background: var(--surface); color: var(--plum); font-weight: 700;
    box-shadow: var(--sh-knob);
  }

  /* ---------- опции ---------- */
  /* строка-переключатель — button[role=switch]: с клавиатуры она была недоступна */
  .opt {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 9px 0; cursor: pointer; text-align: left;
    border: 0; background: transparent; color: inherit; font: inherit;
  }
  .opt > span { min-width: 0; }
  .opt .t { display: block; font-size: 11.5px; font-weight: 600; }
  .opt .d { display: block; font-size: 10px; color: var(--ink2); margin-top: 1px; }
  .opt:disabled { opacity: .45; cursor: default; }
  /* тумблер кита: плоский жёлоб, белая шайба, коралловая заливка на «вкл» */
  .toggle {
    position: relative; width: 44px; height: 26px; flex: none; margin-left: 12px;
    background: var(--hair); border-radius: 999px;
    transition: background .18s;
  }
  /* шайба едет через transform, а не left: left вызывает пересчёт раскладки */
  .toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 1px 3px rgba(140, 48, 12, .28);
    transition: transform .18s;
  }
  .opt.on .toggle { background: var(--coral); }
  .opt.on .toggle::after { transform: translateX(18px); }

  /* ---------- кнопки ---------- */
  .btn {
    width: 100%; margin-top: 14px; padding: 14px;
    border: 0; border-radius: 999px;
    background: var(--coral);
    color: var(--on-accent);
    font: inherit; font-size: 12.5px; font-weight: 650; letter-spacing: 0.1px;
    cursor: pointer;
    box-shadow: var(--sh-accent);
    transition: box-shadow .15s, transform .06s, filter .15s;
  }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: translateY(2px); box-shadow: var(--sh-1); }
  .btn:disabled { opacity: .45; cursor: default; box-shadow: var(--sh-1); }
  /* вторичная кнопка кита: сливовая заливка, белый текст */
  .btn.secondary {
    background: var(--plum); color: #FFFFFF;
    box-shadow: none;
  }
  html.figma-dark .btn.secondary { color: var(--canvas); }
  .btn.ghost-danger {
    background: var(--surface); color: var(--red);
    box-shadow: var(--sh-1);
    padding: 10px;
  }
  .btn.ghost-danger:hover { filter: none; box-shadow: var(--sh-2); }
  #session-close { display: flex; align-items: center; justify-content: center; padding: 10px 14px; }
  .btn-row { display: flex; gap: 8px; align-items: stretch; }
  .btn-row .btn { margin-top: 14px; }
  :focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }

  /* ---------- прогресс ---------- */
  #progress { display: none; margin-top: 16px; }
  /* Отступ большой не случайно: кот встаёт на полосу и поднимается над ней
     ~на 34px — этот зазор даёт ему воздух до текста этапа сверху. */
  #stage { font-size: 11px; color: var(--ink2); margin-bottom: 44px; display: flex; align-items: center; gap: 8px; }
  .spinner {
    width: 12px; height: 12px; flex: none;
    border: 2px solid var(--hair); border-top-color: var(--coral);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #bar {
    position: relative; height: 8px; background: var(--fill);
    border-radius: 999px;
  }
  #fill {
    position: relative;
    height: 100%; width: 0%;
    background: var(--coral);
    border-radius: 999px; transition: width .25s;
  }
  /* Кот едет на переднем крае заливки: он ребёнок #fill у правого края,

  #runner {
    position: absolute; left: 100%; bottom: 2px;
    transform: translateX(-50%);
    pointer-events: none;
  }
  #runner img { display: block; width: 30px; height: auto; }

  /* ---------- результат / ошибки ---------- */
  #done-card, #err-card { display: none; gap: 10px; align-items: flex-start; }
  #done-card { background: var(--green-soft); }
  #done-card .title { color: var(--green); font-weight: 650; margin-bottom: 3px; font-size: 11.5px; }
  #done-card .muted { color: var(--ink2); }
  #err-card {
    background: var(--red-soft);
    color: var(--red); white-space: pre-wrap; user-select: text; font-size: 11px;
  }
  .state-badge {
    position: relative;
    flex: none; width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  /* ушки: background: inherit — тот же цвет, что у кружка, в обеих темах */
  .state-badge::before, .state-badge::after {
    content: ''; position: absolute; top: -3px;
    width: 10px; height: 7px; background: inherit;
    clip-path: polygon(0 100%, 100% 100%, 25% 0);
  }
  .state-badge::before { left: 3px; }
  .state-badge::after { right: 3px; transform: scaleX(-1); }
  .state-body { flex: 1; min-width: 0; }
  #done-card .state-badge { background: var(--green); color: var(--green-soft); }
  #err-card .state-badge { background: var(--red); color: var(--red-soft); }
  #session-hint {
    display: none; background: var(--fill);
    color: var(--plum); font-size: 10.5px;
  }
  /* появление вместо рывка: анимация стартует, когда JS снимает display:none */
  #progress, #done-card, #err-card, #session-hint, #pages {

  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- дополнительно ---------- */
  summary {
    cursor: pointer; color: var(--ink2); font-size: 10.5px; font-weight: 550;
    list-style: none; display: flex; align-items: center; gap: 6px;
  }
  /* без этого WebKit рисует свой треугольник поверх нашей стрелки */
  summary::-webkit-details-marker { display: none; }
  summary::before {
    content: ''; width: 5px; height: 5px; flex: none;
    border-right: 1.5px solid var(--ink2); border-bottom: 1.5px solid var(--ink2);
    transform: rotate(-45deg); transition: transform .15s; margin-top: -1px;
  }
  details[open] summary::before { transform: rotate(45deg); }
  details .inner { padding-top: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid2 .wide { grid-column: 1 / -1; }

  /* ---------- история ---------- */
  #history { display: none; }
  .hist-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: calc(100% + 20px); padding: 7px 10px; margin: 0 -10px;
    border: 0; border-radius: 10px; text-align: left;
    background: transparent; color: inherit; font: inherit; cursor: pointer;
  }
  .hist-row:hover { background: var(--fill); }
  .hist-row .u { flex: 1; min-width: 0; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-row .m { font-size: 9.5px; color: var(--ink2); flex: none; }
  .hist-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .hist-head .field-label { margin: 0; }

  /* карточка памяти сайта: коралловая обводка — «здесь есть что вспомнить» */
  .mem { border: 1.5px solid var(--coral); }
  .mem-top { display: flex; align-items: baseline; gap: 8px; }
  .mem-host { flex: 1; min-width: 0; font-size: 13px; font-weight: 650; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mem-ago { flex: none; font-size: 10px; color: var(--ink2); }
  .mem-top .link-btn { flex: none; color: var(--ink2); }
  .mem-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
  .mem-chip { display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px; font-weight: 600; color: var(--plum);
    background: var(--fill); padding: 4px 9px; border-radius: 999px; }
  .mem-chip svg { flex: none; }
  .mem-actions { display: flex; gap: 8px; align-items: stretch; }
  .mem-actions .btn { margin-top: 0; width: auto; padding: 11px 14px; }
  .mem-actions .mem-import { flex: 1; }

  /* подсказки и коррекция в карточке результата */
  .done-extras { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .done-correct { margin-top: 10px; }
  .done-correct .link-btn { margin-left: -8px; color: var(--ink2); }
  .corr-reasons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip-lite { border: 1px solid var(--hair); background: var(--surface); color: var(--plum);
    font: inherit; font-size: 10.5px; font-weight: 600; padding: 6px 11px;
    border-radius: 999px; cursor: pointer; }
  .chip-lite:hover { border-color: var(--plum); background: var(--fill); }

  /* ---------- донаты ---------- */
  #donate {
    margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--hair);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 10px; color: var(--ink2);
  }
  .don-btn {
    cursor: pointer; padding: 8px 14px; border-radius: 999px; flex: none;
    border: 1.5px solid var(--hair); background: var(--surface); color: var(--plum);
    font: inherit; font-size: 10px; font-weight: 600;
    transition: all .13s;
  }
  .don-btn:hover { border-color: var(--plum); }
  .don-btn:active { transform: translateY(1px); }

  @media (prefers-reduced-motion: reduce) {
    #progress, #done-card, #err-card, #session-hint, #pages { animation: none; }
    * { transition-duration: 0.01ms !important; }
    /* спиннер оставляем — он единственный признак, что импорт идёт,

    .spinner { animation-duration: 2s; }
    html { scroll-behavior: auto; }
  }
  html { scroll-behavior: smooth; }

  // ---------- состояние ----------
  const state = {
    busy: false,
    cancelled: false,
    widths: [1440],
    theme: 'light',
    autoLayout: true,
    screenshot: false,
    styles: false,
    login: false,
    session: null, // { id, width }
    history: [],
    sites: {},           // память по домену: { host: { widths, theme, opts…, lastRun } }
    fetchCtrl: null,
    pendingBuild: null,
    caps: null,
    serverState: 'off',  // off | on | cloud — подпись пилюли собирается из него
    langSetting: 'en',   // en | ru | es
    pages: [],           // [{ url, path, title }] — что нашёл /discover
    pageSel: [],         // выбранные адреса
    pagesMeta: null,     // { source, total, truncated }
    pagesFilter: '',
  };

  const LANGS = ['en', 'ru', 'es'];
  // Стартуем всегда с английского, язык Figma не нюхаем: дальше пользователь
  // переключает сам, выбор сохраняется. Сюда же попадают старые настройки
  // с langSetting: 'auto'.
  function detectLang() {
    return LANGS.indexOf(state.langSetting) >= 0 ? state.langSetting : 'en';
  }
  let L = STR[detectLang()];
  const t = (key, a, b) => (typeof L[key] === 'function' ? L[key](a, b) : L[key]);

  function applyLang() {
    const cur = detectLang();
    L = STR[cur];
    // без lang скринридер читает русский и испанский английским голосом
    document.documentElement.lang = cur;
    document.querySelectorAll('#lang-seg button').forEach((b) => {
      const on = b.dataset.v === cur;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
    $('lang-seg').setAttribute('aria-label', t('language'));
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const v = L[el.dataset.i18n];
      if (typeof v === 'string') el.textContent = v;
    });
    $('don-ton').textContent = t('donBtn');
    $('cancel').textContent = t('cancelBtn');
    $('session-capture').textContent = t('captureBtn');
    $('find-label').textContent = t('findBtn');
    $('find').title = t('findTitle');
    $('url').setAttribute('aria-label', t('urlLabel'));
    $('custom-w').setAttribute('aria-label', t('customLabel'));
    renderEye();
    $('session-close').title = t('closeTitle');
    $('session-close').setAttribute('aria-label', t('closeTitle'));
    $('pages-all').textContent = t('pagesAll');
    $('pages-none').textContent = t('pagesNone');
    $('pages-hide').textContent = t('pagesHide');
    $('pages-search').placeholder = t('pagesSearch');
    $('pages-search').setAttribute('aria-label', t('pagesSearch'));
    validateCustomWidth();
    renderServerPill();
    updateLoginUI();
    applyCaps();
    renderHistory();
    renderPages();
  }

  // ---------- элементы управления ----------
  function renderChips() {
    document.querySelectorAll('#devices .chip[data-w]').forEach((ch) => {
      const on = state.widths.includes(Number(ch.dataset.w));
      ch.classList.toggle('on', on);
      ch.setAttribute('aria-pressed', String(on));
    });
  }
  document.querySelectorAll('#devices .chip[data-w]').forEach((ch) => {
    ch.onclick = () => {
      const w = Number(ch.dataset.w);
      if (state.widths.includes(w)) {
        if (state.widths.length > 1 || $('custom-w').value) state.widths = state.widths.filter((x) => x !== w);
      } else state.widths.push(w);
      renderChips();
      saveSettings();
    };
  });

  // Ширина вне 320–3000 раньше молча выпадала из импорта, а чип оставался
  // активным: пользователь получал «Выберите хотя бы одно устройство» и не
  // понимал, при чём тут это. Теперь поле само говорит, что не так.
  const W_MIN = 320, W_MAX = 3000;
  function customWidth() {
    const raw = $('custom-w').value.trim();
    if (!raw) return null;
    const n = Number(raw);
    return Number.isFinite(n) ? n : NaN;
  }
  function validateCustomWidth() {
    const n = customWidth();
    const bad = n !== null && !(n >= W_MIN && n <= W_MAX);
    $('custom-chip').classList.toggle('on', n !== null && !bad);
    $('custom-chip').classList.toggle('bad', bad);
    $('custom-w').setAttribute('aria-invalid', String(bad));
    $('custom-hint').classList.toggle('show', bad);
    $('custom-hint').textContent = bad ? t('errWidthRange', W_MIN, W_MAX) : '';
    return !bad;
  }
  $('custom-w').oninput = () => { validateCustomWidth(); saveSettings(); };

  document.querySelectorAll('#theme button').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('#theme button').forEach((x) => {
        x.classList.remove('on');
        x.setAttribute('aria-pressed', 'false');
      });
      b.classList.add('on');
      b.setAttribute('aria-pressed', 'true');
      state.theme = b.dataset.v;
      saveSettings();
    };
  });

  function bindToggle(id, key, onChange) {
    $(id).onclick = () => {
      const on = $(id).classList.toggle('on');
      $(id).setAttribute('aria-checked', String(on));
      state[key] = on;
      saveSettings();
      if (onChange) onChange();
    };
  }
  bindToggle('opt-autolayout', 'autoLayout');
  bindToggle('opt-screenshot', 'screenshot');
  bindToggle('opt-styles', 'styles');
  bindToggle('opt-login', 'login', updateLoginUI);

  function updateLoginUI() {
    if (state.login && !state.session) {
      $('go').textContent = t('loginOpenBtn');
    } else if (!state.login) {
      $('go').textContent = t('importBtn');
      if (state.session) closeSession();
    } else {
      $('go').textContent = t('importBtn');
    }
    $('session-btns').style.display = state.session ? 'flex' : 'none';
    $('go').style.display = state.session ? 'none' : 'block';
    $('session-hint').style.display = state.session ? 'block' : 'none';
  }

  // ---------- настройки и история ----------
  function collectSettings() {
    return {
      widths: state.widths,
      customW: $('custom-w').value,
      theme: state.theme,
      autoLayout: state.autoLayout,
      screenshot: state.screenshot,
      styles: state.styles,
      maxHeight: Number($('maxh').value),
      server: $('server').value,
      bypass: $('bypass').value,
      lastUrl: $('url').value,
      lang: state.langSetting,
    };
  }
  let saveTimer = null;
  function saveSettings() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      parent.postMessage({ pluginMessage: { type: 'save-settings', settings: collectSettings() } }, '*');
    }, 300);
  }
  $('url').oninput = () => { saveSettings(); maybeShowMemory(); };
  // Enter в поле адреса запускал ровно ничего — приходилось тянуться мышью
  $('url').onkeydown = (e) => {
    if (e.key !== 'Enter' || state.busy) return;
    e.preventDefault();
    // при открытой сессии кнопка «Импортировать» скрыта, работает другая
    (state.session ? $('session-capture') : $('go')).click();
  };
  // Очистка памяти — забывание в один жест, но в два клика: полное стирание
  // сайтов (среди них — за логином) не должно случаться промахом мыши.
  $('hist-clear').onclick = () => {
    const b = $('hist-clear');
    if (!b.dataset.armed) {
      b.dataset.armed = '1';
      b.textContent = t('clearSure');
      clearTimeout(b._t);
      b._t = setTimeout(() => { delete b.dataset.armed; if ($('hist-clear')) b.textContent = t('clearAll'); }, 3000);
      return;
    }
    delete b.dataset.armed;
    state.sites = {};
    saveSites();
    renderHistory();
    maybeShowMemory();
  };
  $('server').oninput = saveSettings;
  $('bypass').oninput = saveSettings;
  // Токен доступа — секрет по умолчанию скрыт, глаз показывает/прячет
  const EYE_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.6"/></svg>';
  const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a2.6 2.6 0 0 0 3.5 3.5"/><path d="M9.8 5.3A9.6 9.6 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-2.4 3.3"/><path d="M6 6.3A16.7 16.7 0 0 0 2 12s3.6 6.5 10 6.5a9.6 9.6 0 0 0 3.1-.5"/></svg>';
  function renderEye() {
    const shown = $('bypass').type === 'text';
    const b = $('bypass-eye');
    b.innerHTML = shown ? EYE_OFF : EYE_ON;
    b.title = t(shown ? 'bypassHide' : 'bypassShow');
    b.setAttribute('aria-label', b.title);
  }
  $('bypass-eye').onclick = () => {
    const inp = $('bypass');
    inp.type = inp.type === 'password' ? 'text' : 'password';
    renderEye();
    inp.focus();
  };
  renderEye();
  // Ссылка в Телеграм: в Figma внешние URL открывает главный поток
  $('token-link').onclick = (e) => {
    e.preventDefault();
    parent.postMessage({ pluginMessage: { type: 'open-url', url: 'https://t.me/anisimovalisaveta' } }, '*');
  };
  // Статус (прогресс, отмена, итог, ошибка) — сразу под адресом, чтобы после
  // клика было видно, что идёт работа, не прокручивая вниз мимо настроек
  $('url-card').after($('progress'), $('cancel'), $('done-card'), $('err-card'));
  $('maxh').onchange = saveSettings;
  document.querySelectorAll('#lang-seg button').forEach((b) => {
    b.onclick = () => {
      state.langSetting = b.dataset.v;
      saveSettings();
      applyLang();
    };
  });

  function applySettings(s) {
    if (!s) return;
    if (Array.isArray(s.widths) && s.widths.length) state.widths = s.widths;
    if (s.customW) $('custom-w').value = s.customW;
    if (s.theme) {
      state.theme = s.theme;
      document.querySelectorAll('#theme button').forEach((b) => {
        const on = b.dataset.v === s.theme;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', String(on));
      });
    }
    ['autoLayout', 'screenshot', 'styles'].forEach((k) => {
      if (typeof s[k] === 'boolean') {
        state[k] = s[k];
        const el = $('opt-' + (k === 'autoLayout' ? 'autolayout' : k));
        if (el) {
          el.classList.toggle('on', s[k]);
          el.setAttribute('aria-checked', String(s[k]));
        }
      }
    });
    if (s.maxHeight) $('maxh').value = String(s.maxHeight);
    if (s.server) $('server').value = s.server;
    if (s.bypass) $('bypass').value = s.bypass;
    if (s.lastUrl) $('url').value = s.lastUrl;
    if (s.lang) state.langSetting = s.lang;
    renderChips();
    validateCustomWidth();
  }

  function renderHistory() {
    const list = $('history-list');
    list.innerHTML = '';
    const hosts = Object.keys(state.sites).sort((a, b) => (state.sites[b].lastRun || 0) - (state.sites[a].lastRun || 0));
    const legacy = !hosts.length && state.history.length > 0;
    $('history').style.display = (hosts.length || legacy) ? 'block' : 'none';
    const clr = $('hist-clear');
    if (clr) {
      clr.style.display = hosts.length ? '' : 'none';
      clr.textContent = clr.dataset.armed ? t('clearSure') : t('clearAll');
    }
    // Пока сайтов в памяти нет, но есть старая история — показываем её как было.
    if (legacy) {
      for (const h of state.history.slice(0, 6)) {
        const row = document.createElement('button');
        row.type = 'button'; row.className = 'hist-row';
        const u = document.createElement('div'); u.className = 'u'; u.textContent = h.url;
        const m = document.createElement('div'); m.className = 'm'; m.textContent = h.meta || '';
        row.appendChild(u); row.appendChild(m);
        row.onclick = () => { $('url').value = h.url; saveSettings(); maybeShowMemory(); };
        list.appendChild(row);
      }
      return;
    }
    for (const host of hosts.slice(0, 6)) {
      const m = state.sites[host];
      const row = document.createElement('button');
      row.type = 'button'; row.className = 'hist-row';
      const u = document.createElement('div'); u.className = 'u'; u.textContent = host;
      const meta = document.createElement('div'); meta.className = 'm';
      meta.textContent = timeAgo(m.lastRun) + ' · ' + (m.widths || []).join('/') + (m.login ? ' · ' + t('memLogin') : '');
      row.appendChild(u); row.appendChild(meta);
      row.onclick = () => {
        $('url').value = m.url || ('https://' + host);
        saveSettings();
        maybeShowMemory();
        $('site-memory').scrollIntoView({ block: 'nearest' });
      };
      list.appendChild(row);
    }
  }

  function pushHistory(url, meta) {
    state.history = [{ url, meta, ts: Date.now() }, ...state.history.filter((h) => h.url !== url)].slice(0, 8);
    renderHistory();
    parent.postMessage({ pluginMessage: { type: 'save-history', history: state.history } }, '*');
  }

  // ---------- память по домену ----------
  // Ключ памяти — голый хост без www. Один сайт = одна запись, не по URL целиком:
  // важно не «что ты открывал», а «что для этого сайта сработало».
  function siteHost(url) {
    if (!url) return '';
    return String(url).trim().replace(/^https?:\/\//i, '').split(/[/?#]/)[0].toLowerCase().replace(/^www\./, '');
  }
  function saveSites() {
    parent.postMessage({ pluginMessage: { type: 'save-sites', sites: state.sites } }, '*');
  }
  // Записываем не настройки вообще, а те, что реально дали этот импорт.
  function rememberSite(url, run) {
    const host = siteHost(url);
    if (!host) return;
    run = run || {};
    const prev = state.sites[host] || {};
    state.sites[host] = {
      url: /^https?:\/\//i.test(url) ? url : ('https://' + host),
      widths: (run.widths && run.widths.length ? run.widths : state.widths).slice(),
      customW: $('custom-w').value || '',
      theme: state.theme,
      autoLayout: state.autoLayout,
      screenshot: state.screenshot,
      styles: state.styles,
      login: !!run.viaLogin,
      pagesFound: run.pagesFound || prev.pagesFound || 0,
      pagesPicked: run.pagesPicked || 0,
      created: run.created || 0,
      autoLayoutN: run.autoLayout || 0,
      lastRun: Date.now(),
      count: (prev.count || 0) + 1,
    };
    saveSites();
    renderHistory();
  }

  function setTheme(v) {
    state.theme = v;
    document.querySelectorAll('#theme button').forEach((b) => {
      const on = b.dataset.v === v;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
  }
  function setToggle(id, key, on) {
    const el = $(id);
    if (el.disabled) return; // «сайт за логином» бывает недоступен на облаке — не навязываем
    state[key] = on;
    el.classList.toggle('on', on);
    el.setAttribute('aria-checked', String(on));
  }
  // Возвращаем контролам ровно то, что запомнили для сайта.
  function applySiteMemory(m) {
    if (!m) return;
    if (Array.isArray(m.widths) && m.widths.length) { state.widths = m.widths.slice(); renderChips(); }
    if (typeof m.customW === 'string') { $('custom-w').value = m.customW; validateCustomWidth(); }
    if (m.theme) setTheme(m.theme);
    setToggle('opt-autolayout', 'autoLayout', !!m.autoLayout);
    setToggle('opt-screenshot', 'screenshot', !!m.screenshot);
    setToggle('opt-styles', 'styles', !!m.styles);
    setToggle('opt-login', 'login', !!m.login);
    updateLoginUI();
    saveSettings();
  }

  function timeAgo(ts) {
    const s = Math.max(0, Date.now() - (ts || 0)) / 1000;
    if (s < 3600) return t('agoMin', Math.max(1, Math.round(s / 60)));
    if (s < 86400) return t('agoHour', Math.max(1, Math.round(s / 3600)));
    return t('agoDay', Math.max(1, Math.round(s / 86400)));
  }
  function memChips(m) {
    const out = [];
    if (m.widths && m.widths.length) out.push({ t: m.widths.join(' + ') });
    if (m.theme === 'both') out.push({ t: t('themes2') });
    else if (m.theme === 'dark') out.push({ t: t('dark') });
    if (m.login) out.push({ t: t('memLogin'), lock: true });
    if (m.pagesFound > 1) out.push({ t: t('memPages', m.pagesFound) });
    return out;
  }
  function renderMemoryCard(host, m) {
    $('mem-host').textContent = host;
    $('mem-ago').textContent = timeAgo(m.lastRun);
    const wrap = $('mem-chips');
    wrap.innerHTML = '';
    for (const c of memChips(m)) {
      const s = document.createElement('span');
      s.className = 'mem-chip';
      if (c.lock) s.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
      s.appendChild(document.createTextNode(c.t));
      wrap.appendChild(s);
    }
    $('mem-import').textContent = t('memImport');
    $('mem-adjust').textContent = t('memAdjust');
    $('mem-forget').textContent = t('memForget');
    $('mem-import').onclick = () => { applySiteMemory(m); $('site-memory').style.display = 'none'; $('go').click(); };
    $('mem-adjust').onclick = () => { applySiteMemory(m); $('site-memory').style.display = 'none'; $('devices-title').scrollIntoView({ block: 'nearest' }); };
    $('mem-forget').onclick = () => { delete state.sites[host]; saveSites(); $('site-memory').style.display = 'none'; renderHistory(); };
  }
  // Показываем карточку памяти, когда в поле — знакомый домен и мы не заняты.
  function maybeShowMemory() {
    const card = $('site-memory');
    if (!card) return;
    const host = siteHost($('url').value);
    const m = host && state.sites[host];
    if (!m || state.busy || state.session) { card.style.display = 'none'; return; }
    renderMemoryCard(host, m);
    card.style.display = 'block';
  }

  // Цикл обучения: подсказки на будущее и коррекция, кормящая память домена.
  function renderDoneExtras(body, url) {
    const host = siteHost(url);
    if (!host || !state.sites[host]) return;
    const m = state.sites[host];

    const nudges = [];
    if (m.theme === 'light' || m.theme === 'dark') {
      const other = m.theme === 'light' ? 'dark' : 'light';
      nudges.push({ label: t('nudgeTheme', other), run: () => { setTheme(other); saveSettings(); $('go').click(); } });
    }
    if (!state.pages.length) nudges.push({ label: t('nudgePages'), run: () => { $('find').click(); } });
    if (nudges.length) {
      const row = document.createElement('div');
      row.className = 'done-extras';
      for (const n of nudges) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'chip-lite';
        b.textContent = n.label; b.onclick = n.run;
        row.appendChild(b);
      }
      body.appendChild(row);
    }

    const corr = document.createElement('div');
    corr.className = 'done-correct';
    const trigger = document.createElement('button');
    trigger.type = 'button'; trigger.className = 'link-btn';
    trigger.textContent = t('corrAsk');
    const reasons = document.createElement('div');
    reasons.className = 'corr-reasons'; reasons.style.display = 'none';
    const mk = (label, apply) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip-lite';
      b.textContent = label;
      b.onclick = () => {
        apply(); saveSites(); renderHistory();
        corr.innerHTML = '';
        const ok = document.createElement('div');
        ok.className = 'muted'; ok.textContent = t('corrThanks');
        corr.appendChild(ok);
        announce(t('corrThanks'));
      };
      return b;
    };
    reasons.appendChild(mk(t('corrLogin'), () => { m.login = true; }));
    reasons.appendChild(mk(t('corrWidth'), () => { m.widths = []; }));
    trigger.onclick = () => { reasons.style.display = reasons.style.display === 'none' ? 'flex' : 'none'; };
    corr.appendChild(trigger);
    corr.appendChild(reasons);
    body.appendChild(corr);
  }

  // ---------- сервер ----------
  function serverUrl() {
    return $('server').value.trim().replace(/\/+$/, '');
  }

  function applyCaps() {
    const sessionsOk = !state.caps || state.caps.sessions !== false;
    const opt = $('opt-login');
    // disabled, а не pointer-events: none — иначе кнопка остаётся в порядке
    // табуляции и с клавиатуры её всё равно можно переключить
    opt.disabled = !sessionsOk;
    $('login-desc').textContent = sessionsOk ? t('loginDesc') : t('loginDescCloud');
    if (!sessionsOk && state.login) {
      state.login = false;
      opt.classList.remove('on');
      opt.setAttribute('aria-checked', 'false');
      updateLoginUI();
    }
  }

  // Состояние держим отдельно от подписи: смена языка перерисовывает пилюлю
  // сразу, не дожидаясь следующего пинга.
  function renderServerPill() {
    // Пилюлю статуса убрали из шапки — состояние сервера всё равно опрашивается
    // (ping/applyCaps), просто больше нечего перерисовывать.
    const pill = $('server-pill');
    if (!pill) return;
    const s = state.serverState;
    pill.classList.toggle('on', s === 'on' || s === 'cloud');
    $('server-label').textContent = t(s === 'cloud' ? 'serverCloud' : s === 'on' ? 'serverOn' : 'serverOff');
  }

  async function ping() {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 2500);
      const r = await fetch(serverUrl() + '/health', { signal: ctrl.signal });
      clearTimeout(timer);
      let j = null;
      try { j = await r.json(); } catch (e) {}
      const ok = !!(r.ok && j && j.ok);
      state.caps = j ? (j.capabilities || { sessions: !j.cloud }) : null;
      state.serverState = ok ? (j.cloud ? 'cloud' : 'on') : 'off';
      renderServerPill();
      applyCaps();
      return ok;
    } catch (e) {
      state.serverState = 'off';
      renderServerPill();
      return false;
    }
  }

  // ---------- обработка картинок ----------
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  function rasterizeSvg(blob) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const w = img.naturalWidth || 1024;
        const h = img.naturalHeight || 1024;
        const scale = Math.min(2048 / w, 2048 / h, 2);
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(w * scale));
        c.height = Math.max(1, Math.round(h * scale));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('svg decode failed')); };
      img.src = url;
    });
  }

  const SAFE_MIME = /^image\/(png|jpe?g|gif)$/;
  const MAXD = 4000; // лимит Figma — 4096

  async function normalizeOne(img) {
    let mime = (img.mime || '').toLowerCase();
    const url = img.url || '';
    if (!mime || /octet-stream|text\/plain/.test(mime)) {
      if (/\.svg(\?|#|$)/i.test(url)) mime = 'image/svg+xml';
      else if (/\.png(\?|#|$)/i.test(url)) mime = 'image/png';
      else if (/\.jpe?g(\?|#|$)/i.test(url)) mime = 'image/jpeg';
      else if (/\.gif(\?|#|$)/i.test(url)) mime = 'image/gif';
      else if (/\.webp(\?|#|$)/i.test(url)) mime = 'image/webp';
    }
    const bytes = b64ToBytes(img.b64);
    const blob = new Blob([bytes], { type: mime || 'image/png' });

    let source = null, w = 0, h = 0;
    if (mime === 'image/svg+xml') {
      const c = await rasterizeSvg(blob);
      source = c; w = c.width; h = c.height;
    } else {
      try {
        const bmp = await createImageBitmap(blob);
        source = bmp; w = bmp.width; h = bmp.height;
      } catch (e) {
        try {
          const c = await rasterizeSvg(new Blob([bytes], { type: 'image/svg+xml' }));
          source = c; w = c.width; h = c.height;
        } catch (e2) {
          if (SAFE_MIME.test(mime)) return { b64: img.b64, mime };
          return null;
        }
      }
    }

    if (SAFE_MIME.test(mime) && w <= MAXD && h <= MAXD) {
      if (source.close) source.close();
      return { b64: img.b64, mime };
    }
    const scale = Math.min(1, MAXD / w, MAXD / h);
    const cw = Math.max(1, Math.round(w * scale));
    const ch = Math.max(1, Math.round(h * scale));
    const c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    c.getContext('2d').drawImage(source, 0, 0, cw, ch);
    if (source.close) source.close();
    const outMime = mime === 'image/jpeg' ? 'image/jpeg' : 'image/png';
    const dataUrl = c.toDataURL(outMime, 0.9);
    return { b64: dataUrl.slice(dataUrl.indexOf(',') + 1), mime: outMime };
  }

  async function normalizeImages(imageData, onProgress) {
    const ids = Object.keys(imageData || {});
    const out = {};
    let done = 0;
    const queue = [...ids];
    const worker = async () => {
      while (queue.length) {
        if (state.cancelled) return;
        const id = queue.shift();
        try {
          const norm = await normalizeOne(imageData[id]);
          if (norm) out[id] = norm;
        } catch (e) { /* пропускаем */ }
        done++;
        if (onProgress && (done % 5 === 0 || done === ids.length)) onProgress(done, ids.length);
      }
    };
    await Promise.all(Array.from({ length: 4 }, worker));
    return out;
  }

  // ---------- список страниц сайта ----------
  const CHECK_SVG = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

  function filteredPages() {
    const q = state.pagesFilter.trim().toLowerCase();
    if (!q) return state.pages;
    return state.pages.filter(
      (p) => p.title.toLowerCase().indexOf(q) >= 0 || p.path.toLowerCase().indexOf(q) >= 0
    );
  }

  // сколько примерно займёт импорт выбранного
  function estimateMinutes(pageCount) {
    const schemes = state.theme === 'both' ? 2 : 1;
    const variants = Math.max(1, pageCount) * Math.max(1, selectedWidths().length) * schemes;
    return Math.round((variants * 25) / 60);
  }

  function renderPages() {
    const card = $('pages');
    if (!state.pages.length) {
      card.style.display = 'none';
      return;
    }
    card.style.display = 'block';
    $('pages-title').textContent = t('pagesTitle', state.pages.length);

    const list = $('pages-list');
    list.innerHTML = '';
    const shown = filteredPages();

    if (!shown.length) {
      const empty = document.createElement('div');
      empty.className = 'pages-empty';
      // ничего не нашлось — кот спит
      empty.innerHTML = '<svg width="60" height="46" viewBox="0 0 60 46" fill="none" aria-hidden="true">'
        + '<g stroke="var(--ink2)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'
        + '<path d="M8 38 C8 22 17 14 28 14 C39 14 48 22 48 38 Z" fill="var(--fill)"/>'
        + '<path d="M15 21 L12 11 L22 16"/><path d="M41 21 L44 11 L34 16"/>'
        + '<path d="M47 35 C54 34 57 29 54 24"/>'
        + '<path d="M2 38 H54"/>'
        + '<path d="M20 27 q3.5 3.5 7 0" stroke-width="1.9"/>'
        + '<path d="M33 27 q3.5 3.5 7 0" stroke-width="1.9"/>'
        + '<path d="M50 12 h6 l-6 6 h6" stroke-width="1.7"/>'
        + '<path d="M52 3 h4 l-4 4 h4" stroke-width="1.5"/>'
        + '</g></svg>';
      const cap = document.createElement('div');
      cap.textContent = t('pagesNothing');
      empty.appendChild(cap);
      list.appendChild(empty);
    }

    for (const p of shown) {
      const on = state.pageSel.indexOf(p.url) >= 0;
      const row = document.createElement('button');
      row.type = 'button';
      row.setAttribute('role', 'checkbox');
      row.setAttribute('aria-checked', String(on));
      row.className = 'page-row' + (on ? ' on' : '');

      const box = document.createElement('span');
      box.className = 'box';
      box.setAttribute('aria-hidden', 'true');
      box.innerHTML = CHECK_SVG;
      row.appendChild(box);

      const txt = document.createElement('span');
      txt.className = 'txt';
      const n = document.createElement('span');
      n.className = 'n';
      // без заголовка строка была пустой; путь читается лучше, чем ничего
      n.textContent = p.title || p.path || p.url;
      txt.appendChild(n);
      if (p.path && p.path !== n.textContent) {
        const pa = document.createElement('span');
        pa.className = 'p';
        pa.textContent = p.path;
        txt.appendChild(pa);
      }
      row.appendChild(txt);

      row.onclick = () => {
        const i = state.pageSel.indexOf(p.url);
        if (i >= 0) state.pageSel.splice(i, 1);
        else state.pageSel.push(p.url);
        row.classList.toggle('on', i < 0);
        row.setAttribute('aria-checked', String(i < 0));
        renderPagesFoot();
      };
      list.appendChild(row);
    }
    renderPagesFoot();
  }

  function renderPagesFoot() {
    const n = state.pageSel.length;
    let text = t('pagesSelected', n);
    if (n > 0) text += t('pagesEstimate', t('minutes', estimateMinutes(n)));
    $('pages-count').textContent = text;
    $('pages-count').className = '';

    const meta = state.pagesMeta;
    if (meta && meta.truncated) {
      $('pages-count').textContent = text + ' · ' + t('pagesTruncated', state.pages.length, meta.total);
    }
  }

  $('pages-all').onclick = () => {
    const shown = filteredPages();
    for (const p of shown) if (state.pageSel.indexOf(p.url) < 0) state.pageSel.push(p.url);
    renderPages();
  };
  $('pages-none').onclick = () => {
    const shown = filteredPages().map((p) => p.url);
    state.pageSel = state.pageSel.filter((u) => shown.indexOf(u) < 0);
    renderPages();
  };
  $('pages-hide').onclick = () => {
    state.pages = [];
    state.pageSel = [];
    state.pagesMeta = null;
    state.pagesFilter = '';
    $('pages-search').value = '';
    renderPages();
  };
  $('pages-search').oninput = () => {
    state.pagesFilter = $('pages-search').value;
    renderPages();
  };

  $('find').onclick = async () => {
    if (state.busy) return;
    const url = $('url').value.trim();
    if (!url) { showError(t('errNoUrl')); $('url').focus(); return; }

    hideCards();
    setBusy(true);
    $('find').disabled = true;
    setBar(null);
    setStage(t('findStage'));
    // карта сайта обычно отвечает за секунды; если дольше — почти наверняка идёт обход
    const crawlHint = setTimeout(() => { if (state.busy) setStage(t('findStageCrawl')); }, 12000);

    try {
      if (!(await ping())) throw new Error(t('serverHelp'));
      const r = await fetchSnapshot({ url, maxPages: 200 }, '/discover');
      state.pages = r.pages || [];
      state.pagesMeta = { source: r.source, total: r.total, truncated: r.truncated };
      state.pagesFilter = '';
      $('pages-search').value = '';
      // по умолчанию отмечаем только стартовую — остальное пусть выберут сами
      state.pageSel = state.pages.length ? [state.pages[0].url] : [];
      $('progress').style.display = 'none';
      renderPages();
    } catch (e) {
      showError(state.cancelled ? t('errCancelled') : String(e.message || e));
    } finally {
      clearTimeout(crawlHint);
      setBusy(false);
      $('find').disabled = false;
    }
  };

  // ---------- прогресс и статусы ----------
  function setStage(text) {
    const p = $('progress');
    // Появился впервые за прогон — подкручиваем к нему (как к карточке итога),
    // иначе после клика по «Импортировать» спиннер оставался бы вне экрана
    const wasHidden = p.style.display !== 'block';
    p.style.display = 'block';
    $('stage-text').textContent = text;
    if (wasHidden) requestAnimationFrame(() => p.scrollIntoView({ block: 'nearest' }));
  }
  // Прогресс полосы. Настоящего процента для сетевых фаз (поиск страниц,
  // рендер снапшота) сервер не даёт — там плавный «докат» к 90% с замедлением;
  // фазы с реальным процентом (сборка) двигают полосу дальше. Всегда только
  // вперёд и в пределах поля — без петли и без выезда за край. Кот сидит на
  // переднем крае #fill, поэтому едет вместе с полосой сам.
  let barShown = 0, barTimer = null;
  function paintBar(v) {
    barShown = Math.max(0, Math.min(1, v));
    const pct = Math.round(barShown * 100);
    $('fill').style.width = pct + '%';
    $('bar').setAttribute('aria-valuenow', String(pct));
  }
  function stopTrickle() { if (barTimer) { clearInterval(barTimer); barTimer = null; } }
  function resetBar() { stopTrickle(); paintBar(0); }
  function setBar(p) {
    if (p == null) {                 // процент неизвестен — плавный докат к 90%
      if (barTimer) return;
      if (barShown < 0.05) paintBar(0.05);
      barTimer = setInterval(() => paintBar(barShown + (0.9 - barShown) * 0.08), 220);
      return;
    }
    stopTrickle();                   // пришёл настоящий процент — двигаем, но только вперёд
    paintBar(Math.max(barShown, Math.max(0, Math.min(1, p))));
  }
  function hideCards() {
    $('done-card').style.display = 'none';
    $('err-card').style.display = 'none';
  }
  // Значок рисуем из константы, текст — всегда через textContent:
  // в ошибку попадает ответ сервера, вставлять его как разметку нельзя.
  function stateBody(card, iconPath) {
    card.innerHTML = '<span class="state-badge" aria-hidden="true">'
      + '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
      + ' stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">' + iconPath + '</svg></span>';
    const body = document.createElement('div');
    body.className = 'state-body';
    card.appendChild(body);
    card.style.display = 'flex';
    $('progress').style.display = 'none';
    // Панель длиннее экрана: карточка результата висит внизу, и после клика
    // по «Импортировать» её просто не видно. Подкручиваем к ней сами.
    requestAnimationFrame(() => card.scrollIntoView({ block: 'nearest' }));
    return body;
  }
  function showError(text) {
    stateBody($('err-card'), '<path d="M12 7v6"/><path d="M12 17h.01"/>').textContent = text;
  }
  function showDone(lines) {
    const body = stateBody($('done-card'), '<path d="M4.5 12.5l5 5L19.5 7"/>');
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = t('doneTitle');
    body.appendChild(title);
    for (const line of lines) {
      const d = document.createElement('div');
      d.className = 'muted';
      d.textContent = line;
      body.appendChild(d);
    }
    return body;
  }

  function setBusy(b) {
    state.busy = b;
    $('go').disabled = b;
    $('find').disabled = b;
    $('session-capture').disabled = b;
    $('cancel').style.display = b ? 'block' : 'none';
    if (b) resetBar();                                  // новый прогон — полоса с нуля
    else { stopTrickle(); state.cancelled = false; state.fetchCtrl = null; }
  }

  $('cancel').onclick = () => {
    state.cancelled = true;
    if (state.fetchCtrl) state.fetchCtrl.abort();
    parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
    setStage(t('canceling'));
  };

  // ---------- сборка в Figma ----------
  function buildInFigma(payload, opts) {
    return new Promise((resolve, reject) => {
      state.pendingBuild = { resolve, reject };
      parent.postMessage({ pluginMessage: { type: 'build', payload, opts } }, '*');
    });
  }

  // ---------- основной сценарий ----------
  function selectedWidths() {
    const ws = [...state.widths];
    const custom = customWidth();
    if (custom !== null && custom >= W_MIN && custom <= W_MAX) ws.push(Math.round(custom));
    return [...new Set(ws)].sort((a, b) => b - a);
  }

  async function fetchSnapshot(body, endpoint) {
    state.fetchCtrl = new AbortController();
    const token = ($('bypass').value || '').trim();
    const resp = await fetch(serverUrl() + (endpoint || '/snapshot'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, lang: detectLang(), bypass: token || undefined }),
      signal: state.fetchCtrl.signal,
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error);
    return data;
  }

  async function runVariants(variants, endpoint, extraBody, urlForHistory, metaText) {
    hideCards();
    setBusy(true);
    setBar(null);
    const batchId = 'b' + Date.now() + Math.random().toString(36).slice(2, 6);
    const totals = { created: 0, autoLayout: 0, styles: 0, imagesSkipped: 0, svgFailed: 0 };
    const pagesDone = {};
    let failed = 0;
    try {
      if (!(await ping())) throw new Error(t('serverHelp'));
      for (let i = 0; i < variants.length; i++) {
        if (state.cancelled) break;
        const v = variants[i];
        const prefix = variants.length > 1 ? (i + 1) + '/' + variants.length + ' · ' : '';
        setStage(
          v.pageName
            ? prefix + t('stagePage', v.pageIndex, v.pageTotal, v.pageName)
            : prefix + t('stageOpen', v.width, v.scheme ? t(v.scheme).toLowerCase() : '')
        );
        setBar(null);

        let data;
        try {
          data = await fetchSnapshot({
            ...extraBody,
            ...(v.body || {}),
            width: v.width,
            colorScheme: v.scheme,
            screenshot: state.screenshot,
            maxHeight: Number($('maxh').value),
          }, endpoint);
        } catch (e) {
          // одна недоступная страница не должна ронять весь пакет
          if (state.cancelled || variants.length === 1) throw e;
          failed++;
          continue;
        }
        if (state.cancelled) break;

        const imgN = Object.keys(data.imageData || {}).length;
        setStage(prefix + t('stageImages', imgN));
        data.imageData = await normalizeImages(data.imageData, (d, tot) => setBar((i + (d / tot) * 0.4) / variants.length));
        if (state.cancelled) break;

        setStage(prefix + t('stageBuild'));
        const label = v.label + (data.truncated ? ' · ' + t('truncated') : '');
        const res = await buildInFigma(data, {
          batchId,
          label,
          newRow: v.newRow === true,
          autoLayout: state.autoLayout,
          makeStyles: state.styles && i === 0,
          screenshot: state.screenshot,
          lang: detectLang(),
          screenshotName: t('screenshotName'),
        });
        if (v.pageUrl) pagesDone[v.pageUrl] = true;
        totals.created += res.created;
        totals.autoLayout += res.autoLayout;
        totals.styles += res.styles;
        totals.imagesSkipped += res.imagesSkipped;
        totals.svgFailed += res.svgFailed;
      }
      if (state.cancelled) {
        showError(t('errCancelled'));
      } else {
        const lines = [t('lines_layers', totals.created, variants.length)];
        const pageCount = Object.keys(pagesDone).length;
        if (pageCount > 1) lines.unshift(t('lines_pages', pageCount));
        if (failed) lines.push(t('lines_pagesFailed', failed));
        if (state.autoLayout) lines.push(t('lines_al', totals.autoLayout));
        if (totals.styles) lines.push(t('lines_styles', totals.styles));
        if (totals.imagesSkipped) lines.push(t('lines_imgSkipped', totals.imagesSkipped));
        if (totals.svgFailed) lines.push(t('lines_svgFailed', totals.svgFailed));
        const doneBody = showDone(lines);
        const widthsUsed = [...new Set(variants.map((v) => v.width))].sort((a, b) => b - a);
        rememberSite(urlForHistory, {
          widths: widthsUsed,
          viaLogin: endpoint === '/session/capture',
          pagesFound: state.pages.length,
          pagesPicked: Object.keys(pagesDone).length || 1,
          created: totals.created,
          autoLayout: totals.autoLayout,
        });
        pushHistory(urlForHistory, metaText);
        renderDoneExtras(doneBody, urlForHistory);
      }
    } catch (e) {
      showError(state.cancelled ? t('errCancelled') : String(e.message || e));
    } finally {
      setBusy(false);
    }
  }

  $('go').onclick = async () => {
    if (state.busy) return;
    const url = $('url').value.trim();
    // фокус уводим на поле, которое надо починить, а не оставляем на кнопке
    if (!url) { showError(t('errNoUrl')); $('url').focus(); return; }
    if (!validateCustomWidth()) { showError(t('errWidthRange', W_MIN, W_MAX)); $('custom-w').focus(); return; }
    hideCards();

    if (state.login) {
      setBusy(true);
      try {
        if (!(await ping())) throw new Error(t('serverHelp'));
        setStage(t('openingBrowser'));
        const w = selectedWidths()[0] || 1440;
        const r = await fetchSnapshot({ url, width: w, colorScheme: state.theme === 'dark' ? 'dark' : 'light' }, '/session/open');
        state.session = { id: r.sessionId, width: r.width };
        $('session-hint').textContent = t('sessionHint', r.width);
        $('progress').style.display = 'none';
      } catch (e) {
        showError(String(e.message || e));
      } finally {
        setBusy(false);
        updateLoginUI();
      }
      return;
    }

    const widths = selectedWidths();
    if (!widths.length) { showError(t('errNoDevice')); return; }
    const schemes = state.theme === 'both' ? ['light', 'dark'] : [state.theme];
    const host = url.replace(/^https?:\/\//, '').split('/')[0];

    // Если список страниц открыт — импортируем выбранные, иначе одну ссылку из поля.
    let targets;
    if (state.pages.length) {
      if (!state.pageSel.length) { showError(t('errNoPages')); return; }
      // порядок как в списке, а не как кликали
      targets = state.pages.filter((p) => state.pageSel.indexOf(p.url) >= 0).map((p) => ({
        url: p.url,
        name: p.title || p.path,
        path: p.path,
      }));
    } else {
      targets = [{ url, name: host, path: '' }];
    }

    const variants = [];
    for (let pi = 0; pi < targets.length; pi++) {
      const target = targets[pi];
      let firstOfPage = true;
      for (const w of widths) {
        for (const s of schemes) {
          const base = targets.length > 1 ? target.name : host;
          variants.push({
            width: w,
            scheme: s,
            body: { url: target.url },
            pageUrl: target.url,
            pageName: targets.length > 1 ? target.name : '',
            pageIndex: pi + 1,
            pageTotal: targets.length,
            // каждая страница — своя строка фреймов в Figma
            newRow: firstOfPage && pi > 0,
            label: base + ' · ' + w + (schemes.length > 1 ? ' · ' + t(s).toLowerCase() : ''),
          });
          firstOfPage = false;
        }
      }
    }

    const meta =
      (targets.length > 1 ? targets.length + ' × ' : '') +
      widths.join('/') +
      (state.theme === 'both' ? ' · ' + t('themes2') : '');
    await runVariants(variants, '/snapshot', {}, url, meta);
  };

  $('session-capture').onclick = async () => {
    if (state.busy || !state.session) return;
    const host = ($('url').value || 'page').replace(/^https?:\/\//, '').split('/')[0];
    await runVariants(
      [{ width: state.session.width, scheme: null, label: host + ' · ' + state.session.width + ' · ' + t('signedIn') }],
      '/session/capture',
      { sessionId: state.session.id },
      $('url').value.trim() || host,
      state.session.width + ' · ' + t('signedIn')
    );
  };

  async function closeSession() {
    const s = state.session;
    state.session = null;
    updateLoginUI();
    if (s) {
      try { await fetchSnapshot({ sessionId: s.id }, '/session/close'); } catch (e) {}
    }
  }
  $('session-close').onclick = closeSession;

  // ---------- сообщения от плагина ----------
  window.onmessage = (event) => {
    const msg = event.data && event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'init') {
      applySettings(msg.settings);
      state.history = msg.history || [];
      state.sites = msg.sites || {};
      applyLang();
      maybeShowMemory();
    } else if (msg.type === 'progress') {
      if (msg.total) setBar(msg.done / msg.total);
    } else if (msg.type === 'status') {
      setStage(msg.key === 'make-styles' ? t('statusStyles') : t('statusUpload'));
    } else if (msg.type === 'done') {
      if (state.pendingBuild) { state.pendingBuild.resolve(msg.result); state.pendingBuild = null; }
    } else if (msg.type === 'cancelled') {
      if (state.pendingBuild) { state.pendingBuild.reject(new Error(t('errCancelled'))); state.pendingBuild = null; }
    } else if (msg.type === 'error') {
      if (state.pendingBuild) { state.pendingBuild.reject(new Error(msg.text)); state.pendingBuild = null; }
      else showError(msg.text);
    }
  };

  // ---------- донаты ----------
  $('don-ton').onclick = async () => {
    let ok = false;
    try {
      await navigator.clipboard.writeText(TON_ADDRESS);
      ok = true;
    } catch (e) {
      try {
        const ta = document.createElement('textarea');
        ta.value = TON_ADDRESS;
        document.body.appendChild(ta);
        ta.select();
        ok = document.execCommand('copy');
        ta.remove();
      } catch (e2) {}
    }
    $('don-ton').textContent = ok ? t('donCopied') : TON_ADDRESS;
    announce($('don-ton').textContent);
    setTimeout(() => { $('don-ton').textContent = t('donBtn'); }, 2500);
  };

  // ---------- запуск ----------
  $('server').value = DEFAULT_SERVER;
  applyLang();
  renderChips();
  updateLoginUI();
  ping();
  // Раз в 30 с, а не в 5: опрос нужен только для точки в шапке — перед импортом
  // и по клику на плашку плагин пингует отдельно. На пятисекундном интервале
  // тысяча открытых окон дала бы 200 запросов в секунду на облачный сервер.
  setInterval(() => { if (!state.busy) ping(); }, 30000);
  parent.postMessage({ pluginMessage: { type: 'ui-ready' } }, '*');
</script>
