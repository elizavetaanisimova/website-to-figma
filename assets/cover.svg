<svg width="1920" height="960" viewBox="0 0 1920 960" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C1022"/>
      <stop offset="1" stop-color="#131A38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#4E8EF7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4E8EF7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E8EF7"/>
      <stop offset="1" stop-color="#7B5CF0"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4E8EF7"/>
      <stop offset="1" stop-color="#9D7BFF"/>
    </linearGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1920" height="960" fill="url(#bg)"/>
  <rect width="1920" height="960" fill="url(#dots)"/>
  <rect width="1920" height="960" fill="url(#glow)"/>

  <!-- ЛЕВАЯ КОЛОНКА -->
  <g>
    <rect x="150" y="252" width="292" height="46" rx="23" fill="none" stroke="#4E8EF7" stroke-opacity="0.55" stroke-width="2"/>
    <text x="296" y="282" text-anchor="middle" font-size="19" font-weight="600" letter-spacing="3" fill="#7FA9F9">FREE · OPEN SOURCE</text>

    <text x="146" y="420" font-size="104" font-weight="800" letter-spacing="-2" fill="#ffffff">Site to Figma</text>
    <text x="150" y="492" font-size="38" font-weight="400" fill="#A7B0C8">Import any website as editable layers —</text>
    <text x="150" y="544" font-size="38" font-weight="400" fill="#A7B0C8">with Auto Layout, styles and real fonts</text>

    <!-- фичи-пилюли -->
    <g font-size="22" font-weight="600" fill="#DCE4F5">
      <rect x="150" y="608" width="190" height="52" rx="26" fill="#1B2342" stroke="#2A3560" stroke-width="1.5"/>
      <text x="245" y="641" text-anchor="middle">Auto Layout</text>
      <rect x="356" y="608" width="230" height="52" rx="26" fill="#1B2342" stroke="#2A3560" stroke-width="1.5"/>
      <text x="471" y="641" text-anchor="middle">Dark &amp; light theme</text>
      <rect x="602" y="608" width="200" height="52" rx="26" fill="#1B2342" stroke="#2A3560" stroke-width="1.5"/>
      <text x="702" y="641" text-anchor="middle">Multi-device</text>
      <rect x="150" y="676" width="250" height="52" rx="26" fill="#1B2342" stroke="#2A3560" stroke-width="1.5"/>
      <text x="275" y="709" text-anchor="middle">Behind-login sites</text>
      <rect x="416" y="676" width="256" height="52" rx="26" fill="#1B2342" stroke="#2A3560" stroke-width="1.5"/>
      <text x="544" y="709" text-anchor="middle">Color &amp; text styles</text>
    </g>
  </g>

  <!-- ПРАВАЯ ЧАСТЬ: браузер → фрейм -->
  <g>
    <!-- окно браузера -->
    <g>
      <rect x="1010" y="210" width="520" height="380" rx="18" fill="#171E3A" stroke="#2A3560" stroke-width="2"/>
      <rect x="1010" y="210" width="520" height="56" rx="18" fill="#1C2547"/>
      <rect x="1010" y="248" width="520" height="18" fill="#1C2547"/>
      <circle cx="1044" cy="238" r="7" fill="#F76E6E"/>
      <circle cx="1068" cy="238" r="7" fill="#F7C56E"/>
      <circle cx="1092" cy="238" r="7" fill="#3FBF6F"/>
      <rect x="1118" y="224" width="380" height="28" rx="14" fill="#0E1330"/>
      <text x="1136" y="244" font-size="17" fill="#6E7A9E">https://any-website.com</text>
      <!-- скелет страницы -->
      <rect x="1038" y="292" width="464" height="96" rx="10" fill="url(#hero)" opacity="0.9"/>
      <rect x="1038" y="404" width="146" height="76" rx="8" fill="#232D55"/>
      <rect x="1197" y="404" width="146" height="76" rx="8" fill="#232D55"/>
      <rect x="1356" y="404" width="146" height="76" rx="8" fill="#232D55"/>
      <rect x="1038" y="496" width="300" height="16" rx="8" fill="#2E3A6B"/>
      <rect x="1038" y="524" width="220" height="16" rx="8" fill="#2E3A6B" opacity="0.7"/>
    </g>

    <!-- стрелка -->
    <g stroke="url(#accent)" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M1240 632 C1240 700 1300 726 1368 726"/>
      <path d="M1340 700 L1372 726 L1340 752"/>
    </g>

    <!-- фрейм Figma со слоями -->
    <g>
      <rect x="1408" y="620" width="360" height="252" rx="16" fill="#171E3A" stroke="#4E8EF7" stroke-width="2.5"/>
      <text x="1430" y="654" font-size="17" font-weight="600" fill="#7FA9F9"># any-website · 1440</text>
      <!-- список слоёв -->
      <g font-size="17" fill="#C7D2EC">
        <rect x="1430" y="672" width="316" height="36" rx="7" fill="#1E2850"/>
        <rect x="1442" y="682" width="16" height="16" rx="3.5" fill="none" stroke="#7FA9F9" stroke-width="2"/>
        <text x="1470" y="695">hero — Auto Layout ↓</text>
        <rect x="1430" y="716" width="316" height="36" rx="7" fill="#1E2850" opacity="0.75"/>
        <rect x="1442" y="726" width="16" height="16" rx="3.5" fill="none" stroke="#7FA9F9" stroke-width="2"/>
        <text x="1470" y="739">cards — Auto Layout →</text>
        <rect x="1430" y="760" width="316" height="36" rx="7" fill="#1E2850" opacity="0.55"/>
        <text x="1447" y="783" font-weight="700" fill="#7FA9F9">T</text>
        <text x="1470" y="783">heading text</text>
        <rect x="1430" y="804" width="316" height="36" rx="7" fill="#1E2850" opacity="0.4"/>
        <circle cx="1450" cy="822" r="8" fill="none" stroke="#7FA9F9" stroke-width="2"/>
        <text x="1470" y="827">image.png</text>
      </g>
    </g>
  </g>
</svg>
