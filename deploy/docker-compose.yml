# Запуск на VPS (Oracle Cloud и т.п.): сервер рендеринга + Caddy с автоматическим HTTPS.
# Использование: положите домен в .env (DOMAIN=xxx.duckdns.org) и `docker compose up -d --build`
services:
  app:
    build: ../server
    restart: unless-stopped
    environment:
      CLOUD: "1"
      RATE_LIMIT: "30"
      MAX_CONCURRENT: "3"
      # Личный обход лимита: задайте секрет и впишите его в плагине
      # (Дополнительно → «Токен доступа»). Запрос с этим токеном не считается
      # лимитом с любого IP. Пусто/не задано — обход выключен.
      RATE_BYPASS: ${RATE_BYPASS:-}
    expose:
      - "4511"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
